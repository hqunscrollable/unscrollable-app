<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="/app/favicon.svg"><link rel="icon" type="image/png" sizes="64x64" href="/app/favicon-64.png"><link rel="apple-touch-icon" href="/app/icon-180.png"><link rel="manifest" href="/app/manifest.webmanifest"><meta name="theme-color" content="#0F1115">
<title>Forgot password</title><link rel="stylesheet" href="/app/login.css"></head>
<body><form class="box" id="f" autocomplete="on">
<h1>Forgot password</h1><p class="sub">Type your sign-in ID. If the account has an email on file, we send a reset link. It works once and expires in 30 minutes.</p>
<label>Sign-in ID<input id="id" name="username" autocomplete="username" autocapitalize="none" required></label>
<p class="err" id="err" role="alert"></p><p class="okmsg" id="ok" role="status"></p>
<button id="go" type="submit">Send reset link</button>
<p class="alt"><a href="/app/login.html">Back to sign in</a></p>
</form><script src="/app/forgot.js"></script></body></html>
